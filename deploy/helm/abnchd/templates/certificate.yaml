{{- if and (not .Values.tls.createIssuer) (not .Values.tls.issuerRef.name) }}
{{- fail "tls.issuerRef.name is required when tls.createIssuer is false" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "abnchd.certificateName" . }}
  labels:
    {{- include "abnchd.labels" . | nindent 4 }}
spec:
  secretName: {{ include "abnchd.tlsSecretName" . }}
  dnsNames:
    {{- if .Values.tls.dnsNames }}
    {{- range .Values.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
    {{- else }}
    - {{ printf "%s.%s.svc" (include "abnchd.fullname" .) .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" (include "abnchd.fullname" .) .Release.Namespace | quote }}
    {{- end }}
  issuerRef:
    {{- if .Values.tls.createIssuer }}
    name: {{ include "abnchd.caIssuerName" . }}
    kind: Issuer
    group: cert-manager.io
    {{- else }}
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind | default "Issuer" }}
    group: {{ .Values.tls.issuerRef.group | default "cert-manager.io" }}
    {{- end }}
