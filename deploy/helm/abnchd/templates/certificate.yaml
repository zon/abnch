{{- if not .Values.tls.issuerRef.name }}
{{- fail "tls.issuerRef.name is required" }}
{{- end }}
{{- $dnsNames := .Values.tls.dnsNames }}
{{- if not $dnsNames }}
{{- $dnsNames = list
      (printf "%s.%s.svc" (include "abnchd.fullname" .) .Release.Namespace)
      (printf "%s.%s.svc.cluster.local" (include "abnchd.fullname" .) .Release.Namespace) }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.hostname }}
{{- $dnsNames = append $dnsNames .Values.ingress.hostname }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "abnchd.certificateName" . }}
  labels:
    {{- include "abnchd.labels" . | nindent 4 }}
spec:
  secretName: {{ include "abnchd.tlsSecretName" . }}
  dnsNames:
    {{- range uniq $dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind | default "Issuer" }}
    group: {{ .Values.tls.issuerRef.group | default "cert-manager.io" }}
