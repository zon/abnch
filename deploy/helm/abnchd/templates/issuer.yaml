{{- if .Values.tls.createIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "abnchd.selfSignedIssuerName" . }}
  labels:
    {{- include "abnchd.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "abnchd.caCertificateName" . }}
  labels:
    {{- include "abnchd.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ printf "%s-ca" (include "abnchd.fullname" .) | trunc 64 | quote }}
  secretName: {{ include "abnchd.caSecretName" . }}
  issuerRef:
    name: {{ include "abnchd.selfSignedIssuerName" . }}
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "abnchd.caIssuerName" . }}
  labels:
    {{- include "abnchd.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "abnchd.caSecretName" . }}
{{- end }}
