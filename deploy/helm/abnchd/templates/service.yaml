apiVersion: v1
kind: Service
metadata:
  name: {{ include "abnchd.fullname" . }}
  labels:
    {{- include "abnchd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "abnchd.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
