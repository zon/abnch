- Repos, tasks, tests, and data each have a service-assigned id that never changes. A task links to its repo by id, a test to its task, and a datum to its test. A task table row holds no org, repo, or parent stub columns, and likewise for tests and data. Stubs and refs stay unique within their parent, as in the [Schema Design](docs/design/schema.md). The database rejects a task, test, or datum whose parent is missing.
- Models, agents, and graders each have a service-assigned id. An agent links to its task by id and a grader to its test by id. Models stay unique by name, provider, and variant. Agents and graders stay unique by their stub, commit, branch, version, uncommitted flag, and parent link. Saving the same values again reuses the existing record, and an agent or grader name that differs does not make a new record.
- A result links to its datum, model, and agent by id. A score links to its result, model, and grader by id. A result or score table row holds no org, repo, task, test, or embedded model, agent, or grader columns. The database rejects a result or score whose datum, result, model, agent, or grader is missing. A result with no model or agent is still rejected as before.
- Adding the same result body with the same model and agent for the same datum returns the same ref and leaves one result. Adding the same score body with the same model and grader for the same result returns the same ref and leaves one score. Refs are still derived from the body and the linked records, and the refs for existing values do not change.
- Renaming a task keeps its id. Its tests, data, results, scores, and agents stay linked, and `GET /repos/{org}/{repo}/tasks/{task}/tests/{test}` and the results and scores under the new stub return what they returned before the rename. A later result with the same agent values for the renamed task reuses the existing agent record.
- Renaming a test keeps its id. Its data, results, scores, and graders stay linked, and the data, results, and scores under the new stub return what they returned before the rename. A later score with the same grader values for the renamed test reuses the existing grader record.
- The service API does not accept or return ids. Every route, request body, and response keeps the same shape it has today, and stubs and refs identify records, as in the [Repo Service API](specs/service/repo.md).
- Apply a patch bump to the repo version, to the Helm chart version, and to the Helm chart app version
