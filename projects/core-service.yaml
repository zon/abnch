# Core Service milestone: abnchd from a local service config and Postgres,
# service authentication and roles, the repo and task APIs, and the abnch
# login, repo inference, and task commands.
# See docs/milestones.md and specs/service/*, specs/cli/*.

- "`abnchd <config>` starts the service from the service config file, reads the service url and the Postgres block, and exits non-zero with a clear error when the file is missing, malformed, or the database is unreachable"
- "The service stores repos and tasks in Postgres and creates the tables it needs on startup"
- "A service request with no credentials or with credentials the service cannot verify returns `401` and performs no operation"
- "The service authenticates workload OAuth tokens against the issuers configured in the service config, rejecting a token with an unknown issuer, a wrong audience, a bad signature, or a past expiry with `401`"
- "The service accepts a Kubernetes service account token, a GitHub workflow token, and a token from the local dev issuer as workload credentials"
- "The service serves the local dev issuer's OIDC configuration and JWKS"
- "The service signs in a human user through the configured OIDC provider with the authorization code flow and, on success, grants a session that identifies the user and carries the user's roles; a failed sign-in grants no session"
- "The service derives roles from the role claim through the role map; a claim value with no mapping grants no role, humans hold Reader or Admin, and workloads hold Service, Agent, or Grader"
- "The service enforces its roles: read operations are allowed for Reader, Service, and Admin, writes are allowed for Admin only, Service, Agent, and Grader get their defined access, and a role without access returns `403` and performs no part of the operation"
- "Service error responses use a `4xx` or `5xx` status and a JSON body carrying an error message"
- "`GET /repos` returns the repos visible to the caller as a JSON array"
- "`GET /repos/{org}/{stub}` returns one repo with its org stub, repo stub, and URL, or `404` when it is missing"
- "`PUT /repos/{org}/{stub}` creates a missing repo from the body's URL and returns `201`, updates an existing repo by merging the body and returns `200`, and rejects a missing URL with `422` without creating a repo"
- "The service identifies a repo by its org stub and repo stub, so two repos with the same stubs are the same repo regardless of URL, and rejects an empty or non-URL-safe stub"
- "`GET /repos/{org}/{repo}/tasks` returns the repo's tasks as a JSON array, or `404` when the repo is missing"
- "`GET /repos/{org}/{repo}/tasks/{stub}` returns one task with its stub, name, description, and repo, or `404` when it is missing"
- "`PUT /repos/{org}/{repo}/tasks/{stub}` creates a missing task and returns `201`, merges the body into an existing task and returns `200`, and rejects a missing required field with `422` without creating the task"
- "Writing a task to a missing repo returns `404` and creates no repo or task"
- "`POST /repos/{org}/{repo}/tasks/{stub}/move` renames a task, returns `200` on success, `404` when the task is missing, and `409` when the new stub is taken"
- "`abnch login` runs the OIDC authorization code flow in a browser with a loopback callback and stores the session for the service URL in `~/.abnch/credentials.yaml`; it exits zero on success and non-zero with an error on stderr and no session on failure"
- "`abnch logout` removes the stored session for the service URL and exits zero, including when no session is stored"
- "The CLI takes the service URL from `--url` when given and from `.abnch/config.yaml` otherwise, and `abnch login` and `abnch logout` fail when neither provides one"
- "A command that reaches the service presents the stored session or the local credential for the service URL, and fails telling the user to run `abnch login` when the session is missing or expired"
- "When the service returns `401`, the CLI fails telling the user to run `abnch login` and does not retry with other credentials"
- "The CLI derives the repo's org stub and repo stub from the Git remote `origin`, supporting the common HTTPS and SSH forms with or without a `.git` suffix or a trailing slash"
- "When the CLI cannot derive a repo, commands that need one fail non-zero with an error on stderr and send no request to the service"
- "`abnch set task <stub>` creates or updates a task in the inferred repo by merging `--name`, `--description`, and a YAML or JSON stdin body with the existing task, creating the repo first when it is missing"
- "`abnch set task <stub> --move <new>` renames a task and fails when the task is missing or the new stub is taken"
- "`abnch set task <stub> --model <stub>` records the task's default model in `.abnch/config.yaml` and does not change the task on the service"
- "`abnch get tasks` lists the inferred repo's tasks as YAML and `abnch get task <stub>` prints one task as YAML, failing non-zero when the task is missing"
- "The CLI exits zero on success and non-zero on failure, writes errors to stderr and command output to stdout, and surfaces the service error message when the service returns an error"
