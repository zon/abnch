# Models and Agents milestone: the result service API, the model and agent config
# commands, and the abnch run command with local agent execution.
# See docs/milestones.md, docs/design/run.md, specs/service/result.md,
# specs/cli/model.md, specs/cli/agent.md, and specs/cli/run.md.

- "The service stores results in Postgres and creates the table it needs on startup"
- "The service identifies a result by its datum and a short URL-safe ref derived from its JSON within that datum, so the same JSON for the same datum always has the same ref and is the same result, and the same JSON for different data has a different identity"
- "A result carries its JSON, logs, input tokens, output tokens, token cost, and run duration, and may carry the local branch that produced it; token counts, cost, and duration are numbers zero or greater and default to zero when omitted"
- "The service rejects a result with a negative token count, cost, or duration with `422` without creating the result"
- "`POST /repos/{org}/{repo}/results` adds a result from a body carrying the task stub, test stub, datum ref, and result JSON, returning `201` for a new ref and `200` when the ref exists without a second result, rejecting a malformed body with `422`, and returning `404` when the datum is missing"
- "`GET /repos/{org}/{repo}/results` returns the repo's result refs as a JSON array, or `404` when the repo is missing"
- "`GET /repos/{org}/{repo}/results/{ref}` returns one result with its ref, task, test, datum ref, JSON, logs, tokens, cost, duration, and local branch, or `404` when it is missing"
- "Result reads are allowed for the Reader, Service, and Admin roles, and result writes are allowed for the Service and Admin roles only; a role without access returns `403` and performs no part of the operation"
- "`abnch set model <provider>/<name>` records a model in the CLI config with its provider and name plus `--variant` when given, using `--stub` when given and a stub derived from the name otherwise, and fails non-zero with an error on stderr when the argument has no provider"
- "`abnch get models` lists the models in the CLI config as YAML and `abnch get model <stub>` prints one model as YAML, failing non-zero when the model is missing"
- "`abnch set agent <task>` records the task's agent in the CLI config from `--version-cmd`, `--build-cmd`, and `--run-cmd`, merging with an existing agent, and fails non-zero with an error on stderr when the agent has no run command"
- "`abnch get agent <task>` prints the task's agent as YAML, failing non-zero when the task has no agent"
- "`abnch run <task>/<test>` resolves the task's agent and model, builds the agent once, runs it against each datum in the test, records a result for each, and prints the result refs, failing non-zero with an error on stderr when the task has no agent, no model is set, or the test is missing"
- "`abnch run <task>/<test>/<ref>` runs the agent against one datum, and fails non-zero with an error on stderr when the datum is missing"
- "`abnch run` accepts `--model` to override the task's default model, `--limit` to cap the data it runs, `--shuffle` to randomize the data order, and `--local` to select a local run, and fails non-zero when `--model` names a model the config does not hold"
- "The CLI passes a JSON object on stdin to the agent's run command carrying the model's name, provider, and variant, and the datum's JSON"
- "The CLI reads the agent's run command stdout, treats text before the abnch marker as the result's logs, parses the JSON after the marker as the run output, and records the run output's result JSON and token counts, its own measured run duration, and the working directory's Git branch, failing non-zero when the output carries no marker or no result JSON"
- "`abnch get results` lists the inferred repo's results as YAML and `abnch get result <ref>` prints one result as JSON, failing non-zero with an error on stderr when the result is missing"
