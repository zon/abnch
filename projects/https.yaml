- The service config supports a `listen` address. `abnchd` binds it when set and falls back to the host and port in `url` when it is absent. `url` remains the base URL the service uses for self-references.
- A service config with an `https` URL and no `tls` block fails to start with a clear error. A service config with an `http` URL and a `tls` block also fails. A config with no `tls` block serves HTTP.
- When `tls.certFile` and `tls.keyFile` name a valid certificate and key, `abnchd` serves every API request over HTTPS on its listen address, uses TLS 1.2 or newer, and serves no plaintext API on another port.
- The service fails to start when either configured TLS file is missing or unreadable, or when the certificate and key do not pair. The error names the file or the invalid pair.
- The service picks up a renewed certificate and key from the configured paths without a process restart. New TLS connections use the renewed pair.
- The Helm chart renders a cert-manager Certificate for the service, a self-signed Issuer, a CA Certificate, and a CA-backed Issuer by default. The service Certificate is signed by the CA. `tls.createIssuer=false` and `tls.issuerRef` make the chart use an existing issuer and render no private CA resources.
- The chart fails to render when `tls.createIssuer=false` and `tls.issuerRef.name` is empty, with an error naming the required issuer.
- The chart's Certificate covers `tls.dnsNames`. When the value is empty, it covers the Service's cluster DNS name. The Certificate writes its key pair to the Secret the Deployment mounts.
- The Deployment mounts the certificate Secret at `/etc/abnchd/tls` read-only. The rendered service config sets `config.tls.certFile` and `config.tls.keyFile` to the mounted files, sets `config.listen` to `0.0.0.0:8443`, and uses an `https` `config.url`.
- The Service exposes port 443 and forwards it to a container port named `https` on 8443. The container exposes that port. The chart serves no plaintext port.
- The chart requires cert-manager and renders valid manifests. `helm lint` passes, and `helm template` with the default values includes the Certificate and Issuer resources.
- Local development keeps running over HTTP on loopback. `just config` writes an `http://localhost:<port>` URL and adds no `tls` block.
- Apply a semver major bump to the app version.
- Bump the Helm chart version and appVersion to the repo version.
