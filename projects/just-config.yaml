- 'The repo root has a `Justfile` with a `config` recipe, so a developer can run `just config` to set up a local service'
- '`just config` takes an optional local service port and uses `8080` when none is given, and passes it to `abnchctl set local-auth`, which sets the local service URL to `http://localhost:<port>`'
- '`just config` delegates the setup work to `abnchctl set local-auth`, driving the `abnchctl` developer CLI instead of writing the config itself'
- '`abnchctl set local-auth` prompts for each Postgres field in turn: host, port, dbname, user, password, sslmode, and timeZone; the password prompt hides typing, sslmode defaults to `disable`, and timeZone defaults to `UTC`'
- '`abnchctl set local-auth` writes the local service URL to the top-level `url` field and the collected Postgres values under `postgres` in `service-config.local.yaml` in the repo root, then reports the file path'
- 'A first run with no existing config completes without error and produces a complete local service config'
- 'When `service-config.local.yaml` already exists, each stored value is offered as the prompt default, so a later run changes one value without retyping the rest'
- '`abnchctl set local-auth` generates an asymmetric dev key pair and writes the private key to `dev-issuer.key` in the repo root, so a local service can serve the matching public JWKS'
- '`abnchctl set local-auth` adds a dev issuer to `oauth.issuers` in `service-config.local.yaml` with the issuer URL set to the local service URL plus `/dev`, the audience `abnch`, the role claim `sub`, and a role map granting `Admin` to `local-cli` and `Service` to `local-runtime`'
- 'Rerunning `abnchctl set local-auth` for the same port does not add a second dev issuer entry'
- '`abnchctl set local-auth` writes a local CLI credential for the local service URL into `~/.abnch/credentials.yaml`, without changing credentials stored for any other service URL'
- 'The local CLI credential authenticates as the `local-cli` subject of the dev issuer, so the CLI can reach the local service without `abnch login`'
- 'After `abnchctl set local-auth` succeeds, `just config` runs `abnchctl check config` to confirm the local service config files are present'
- '`abnchctl check config` requires one auth entry and complete Postgres connection config, and fails with a clear error when a config file or required value is missing'
- '`service-config.local.yaml` and `dev-issuer.key` are excluded from version control'
- 'When `abnchctl set local-auth` or `abnchctl check config` fails, `just config` exits non-zero and reports the failure'
