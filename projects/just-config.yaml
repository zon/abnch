- 'The repo root has a `Justfile` with a `config` recipe, so a developer can run `just config` to set up a local service'
- '`just config` takes an optional local service port and uses `8080` when none is given, and the port sets the local service URL to `http://localhost:<port>`'
- '`just config` prompts for each Postgres field in turn: host, port, dbname, user, password, sslmode, and timeZone; the password prompt hides typing, sslmode defaults to `disable`, and timeZone defaults to `UTC`'
- '`just config` writes the collected Postgres values and the local service URL to `service-config.local.yaml` in the repo root, then reports the file path'
- 'A first run with no existing config completes without error and produces a complete local service config'
- 'When `service-config.local.yaml` already exists, each stored value is offered as the prompt default, so a later run changes one value without retyping the rest'
- '`just config` generates an asymmetric dev key pair and writes the private key to `dev-issuer.key` in the repo root, so a local service can serve the matching public JWKS'
- '`just config` adds a dev issuer to `oauth.issuers` in `service-config.local.yaml` with the issuer URL set to the local service URL plus `/dev`, the audience `abnch`, the role claim `sub`, and a role map granting `Admin` to `local-cli` and `Service` to `local-runtime`'
- 'Rerunning `just config` for the same port does not add a second dev issuer entry'
- '`just config` writes a local CLI credential for the local service URL into `~/.abnch/credentials.yaml`, without changing credentials stored for any other service URL'
- 'The local CLI credential authenticates as the `local-cli` subject of the dev issuer, so the CLI can reach the local service without `abnch login`'
- '`service-config.local.yaml` and `dev-issuer.key` are excluded from version control'
- 'When the recipe cannot write the config or credentials, it exits non-zero and reports the failure'
