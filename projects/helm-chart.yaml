# Deployment milestone: a Helm chart that installs the service into a cluster
# from a service config supplied through chart values.
# See docs/milestones.md, docs/design/deployment.md,
# docs/design/app/abnchd-config.md, and specs/deployment/helm.md.

- "The repo ships a Helm chart at `deploy/helm/abnchd` that installs the service into a cluster as a Deployment running the service image and a Service that reaches it"
- "The chart's values supply the service config: the service URL, the Postgres connection, and the OIDC and workload auth settings. The chart renders that config into a file the container reads and starts `abnchd` with its path"
- "The Postgres password and the OIDC client secret come from a Kubernetes secret whose name and keys are chart values, so the chart never holds those values in plaintext"
- "The service image repository and tag are chart values that default to `ghcr.io/zon/abnch/abnchd` at the repo version, so a caller can install the chart and reach a running service"
- "`helm lint` reports no error and `helm template` renders valid Kubernetes manifests for the chart with its default values"
- "Apply a semver minor bump to the app version"
