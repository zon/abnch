# Graders and Scores milestone: the score service API, the grader config
# commands, and the abnch score command with local grader execution.
# See docs/milestones.md, docs/design/score.md, docs/design/schema.md,
# specs/service/score.md, specs/cli/grader.md, and specs/cli/score.md.

- "The service stores scores in Postgres and creates the table it needs on startup"
- "The service identifies a score by its result and a short URL-safe ref derived from its key-number dictionary within that result, so the same dictionary for the same result always has the same ref and is the same score, and the same dictionary for different results has a different identity"
- "A score carries its key-number dictionary, logs, input tokens, output tokens, token cost, and run duration; token counts, cost, and duration are numbers zero or greater and default to zero when omitted"
- "The service rejects a score with a negative token count, cost, or duration with `422` without creating the score"
- "The service rejects a score whose keys are not all in its test's score schema, or whose values are not numbers, with `422` without creating the score"
- "`POST /repos/{org}/{repo}/scores` adds a score from a body carrying the task stub, test stub, result ref, and score dictionary, returning `201` for a new ref and `200` when the ref exists without a second score, rejecting a malformed body with `422`, and returning `404` when the result is missing"
- "`GET /repos/{org}/{repo}/scores` returns the repo's score refs as a JSON array, or `404` when the repo is missing"
- "`GET /repos/{org}/{repo}/scores/{ref}` returns one score with its ref, task, test, result ref, dictionary, logs, tokens, cost, and duration, or `404` when it is missing"
- "Score reads are allowed for the Reader, Service, and Admin roles, and score writes are allowed for the Service and Admin roles only; a role without access returns `403` and performs no part of the operation"
- "`abnch set grader <task>` records the task's grader in the CLI config from `--version-cmd`, `--build-cmd`, and `--run-cmd`, merging with an existing grader, and fails non-zero with an error on stderr when the grader has no run command"
- "`abnch get grader <task>` prints the task's grader as YAML, failing non-zero when the task has no grader"
- "`abnch score <result ref>` resolves the task's grader and model, builds the grader once, runs it against the result, records a score, and fails non-zero with an error on stderr when the task has no grader, no model is set, or the result is missing"
- "`abnch score` accepts `--model` to override the task's default model and `--local` to select a local run, and fails non-zero when `--model` names a model the config does not hold"
- "The CLI passes a JSON object on stdin to the grader's run command carrying the model's name, provider, and variant, the datum's JSON, and the result's JSON"
- "The CLI reads the grader's run command stdout, treats text before the abnch marker as the score's logs, parses the JSON after the marker as the score output, and records the score output's dictionary and token counts and its own measured run duration, failing non-zero when the output carries no marker or no score dictionary"
- "`abnch get scores` lists the inferred repo's scores as YAML and `abnch get score <ref>` prints one score as JSON, failing non-zero with an error on stderr when the score is missing"
