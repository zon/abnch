# Tests and Data milestone: the test and data service APIs, a test's version and
# score schema, content-addressed data with file references, and the abnch test
# and data commands.
# See docs/milestones.md and specs/service/test.md, specs/service/data.md,
# specs/cli/test.md, specs/cli/data.md.

- "The service stores a task's tests in Postgres and creates the table it needs on startup"
- "The service identifies a test by its repo, task stub, and test stub, so two writes to the same stubs are the same test"
- "A test carries a name, a description, a version, and a score schema of keys, each with a stub and a name. The version is a non-empty string and an empty schema is allowed"
- "The service rejects a test with a missing name or version with `422` without creating the test"
- "The service rejects a score schema with a duplicate key stub with `422` without creating the test"
- "`GET /repos/{org}/{repo}/tasks/{task}/tests` returns the task's tests as a JSON array, or `404` when the task is missing"
- "`GET /repos/{org}/{repo}/tasks/{task}/tests/{stub}` returns one test with its stub, name, description, version, and schema, or `404` when it is missing"
- "`PUT /repos/{org}/{repo}/tasks/{task}/tests/{stub}` creates a missing test and returns `201`, merges the body into an existing test and returns `200`, and replaces the schema when the body carries one"
- "Writing a test to a missing task returns `404` and creates no task or test"
- "`POST /repos/{org}/{repo}/tasks/{task}/tests/{stub}/move` renames a test, returns `200` on success, `404` when the test is missing, and `409` when the new stub is taken"
- "Test read operations are allowed for Reader, Service, and Admin, and test writes are allowed for Admin only; a role without access returns `403` and performs no part of the operation"
- "The service stores a test's data in Postgres and creates the table it needs on startup"
- "The service identifies a datum by its repo, task stub, test stub, and a short URL-safe ref derived from its JSON, so the same JSON in a test always has the same ref and is the same datum, and different JSON has a different ref"
- "The service stores a datum's JSON unchanged and returns it unchanged, including file references, which are JSON objects carrying a `url` and a `checksum` that agents and graders download and verify"
- "`GET /repos/{org}/{repo}/tasks/{task}/tests/{test}/data` returns the test's data refs as a JSON array, or `404` when the test is missing"
- "`GET /repos/{org}/{repo}/tasks/{task}/tests/{test}/data/{ref}` returns one datum's JSON, or `404` when it is missing"
- "`POST /repos/{org}/{repo}/tasks/{task}/tests/{test}/data` adds a datum from the body and returns its ref, returning `201` for a new ref and `200` when the ref already exists without a second datum, rejecting a malformed JSON body with `422`, and returning `404` when the test is missing"
- "Data read operations are allowed for Reader, Service, and Admin, and data writes are allowed for Admin only; a role without access returns `403` and performs no part of the operation"
- "`abnch set test <task>/<stub>` creates or updates a test by merging `--name`, `--description`, `--version`, and a YAML or JSON stdin body, including the schema, with the existing test, and fails non-zero with an error on stderr when a required field is missing or the task is missing"
- "`abnch set test <task>/<stub> --move <new>` renames a test and fails when the test is missing or the new stub is taken"
- "`abnch get tests <task>` lists a task's tests as YAML and `abnch get test <task>/<stub>` prints one test as YAML, failing non-zero when the test is missing"
- "`abnch add data <task>/<test>` adds a datum from stdin or `--file`, prints the datum's ref, and fails non-zero with an error on stderr when the input is not valid JSON or the test is missing"
- "`abnch get data <task>/<test>` lists a test's data refs and `abnch get data <task>/<test>/<ref>` prints one datum as JSON, failing non-zero when the datum is missing"
