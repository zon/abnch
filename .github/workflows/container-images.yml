name: Container images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zon/abnch/abnchd

jobs:
  service-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Read the repo version
        id: version
        run: echo "value=$(cat internal/version/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build the service image
        run: |
          podman build -f deploy/containers/Containerfile \
            -t "$IMAGE:${{ steps.version.outputs.value }}" \
            -t "$IMAGE:${{ github.sha }}" .

      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy

      - name: Scan the image
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE:${{ steps.version.outputs.value }}"

      - name: Push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:${{ steps.version.outputs.value }}"
          podman push "$IMAGE:${{ github.sha }}"
