- path: Justfile
  description: Sets up a local service for development, and builds and scans the service image.

- path: deploy/containers
  description: Builds and configures the deployed containers.

- path: cmd/abnch
  description: Provides the abnch CLI.

- path: cmd/abnchctl
  description: Provides the local development CLI.

- path: cmd/abnchd
  description: Starts the service from a service config file.

- path: internal/auth
  description: Authenticates and authorizes service callers, signs human users in, and publishes the local dev issuer.

- path: internal/devconfig
  description: Stores the local service configuration and the CLI credential store, and publishes the local dev config for Ralph remote runs.

- path: internal/httpx
  description: Writes the service API's JSON responses.

- path: internal/kube
  description: Thin wrapper around kubectl for managing Kubernetes resources.

- path: internal/store
  description: Stores repos, tasks, tests, data, results, and scores in Postgres and creates its tables.

- path: internal/service
  description: Runs the service from its configuration.
