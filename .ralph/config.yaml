mode: worktree
model: deepseek/deepseek-flash
variant: high
before:
  - name: copy-local-service-config
    command: sh
    args:
      - -c
      - |
        src=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")
        [ "$src" = "$PWD" ] && exit 0
        cp -a "$src/.abnchd" .
